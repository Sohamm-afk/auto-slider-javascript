<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/1935d064dd.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Product Slider</h1>
    <main>
        <div class="slide-container">
            
        <img id="slide-left" class="arrow" src="images/left red.png">
    <section class="container" id="slider" tabindex="0"
         aria-label="Product carousel"></section>
    <img id="slide-right" class="arrow" src="images/right red.jpg">
</div>
<button id="autoplay-toggle" type="button" aria-label="Pause automatic sliding">
    Pause
</button>
<div class="autoplay-progress" aria-hidden="true">
    <div id="autoplay-progress-fill"></div>
</div>
<div id="cart-toast" class="cart-toast" role="status" aria-live="polite"></div>
</main>
    

    <script src="script.js"></script>
</body>
</html>
